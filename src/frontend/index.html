<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barrio Market — Asistente de Reabastecimiento (RF-006 & RF-007)</title>
  <meta name="description" content="Simulación conversacional del agente de Barrio Market para gestión de órdenes de compra, manejo de errores y reintentos (RF-006).">
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="app-layout" id="app-root">
    <!-- Chat Header -->
    <header class="chat-header">
      <div class="header-brand">
        <div class="brand-avatar-container">
          <div class="brand-avatar" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
          </div>
          <span class="online-dot-pulse"></span>
        </div>
        <div class="brand-info">
          <h1>Barrio Market <span class="header-badge">Bot v1.0</span></h1>
          <div class="status-container">
            <span class="status-badge status-online" id="status-indicator">
              <span class="status-indicator-dot"></span> En línea (Telegram Agent)
            </span>
          </div>
        </div>
      </div>

      <div class="header-controls">
        <div class="toggle-switch-wrapper">
          <span class="toggle-label-text">Simular Falla</span>
          <span class="spec-tag">RF-006</span>
          <label class="switch" title="Activa la simulación de error controlada para demostrar RF-006">
            <input type="checkbox" id="toggle-simulate-error" />
            <span class="slider round"></span>
          </label>
        </div>
      </div>
    </header>

    <!-- Chat Messages Window -->
    <main class="chat-messages" id="chat-messages" role="log" aria-live="polite">
      <!-- Dynamic messages and typing indicator will be inserted here -->
    </main>

    <!-- Quick Prompts Bar for Academic Demonstration -->
    <div class="quick-prompts-bar" id="quick-prompts" aria-label="Sugerencias rápidas para demostración">
      <span class="prompts-label">Pruebas rápidas:</span>
      <button type="button" class="prompt-chip chip-success" data-prompt="Necesito reabastecer arroz de 500 gramos">
        <span class="chip-icon">🍚</span> Arroz (RF-007 Éxito)
      </button>
      <button type="button" class="prompt-chip chip-info" data-prompt="Reabastecer leche entera 1 litro">
        <span class="chip-icon">🥛</span> Leche (RF-007 Éxito)
      </button>
      <button type="button" class="prompt-chip chip-warning" data-prompt="Necesito pedir jabón en polvo 1kg">
        <span class="chip-icon">✨</span> No Registrado (BR-003)
      </button>
    </div>

    <!-- Chat Input Footer -->
    <footer class="chat-footer">
      <form class="input-form" id="chat-form" autocomplete="off">
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <input 
            type="text" 
            id="message-input" 
            class="chat-input" 
            placeholder="Escribe una solicitud en lenguaje natural (ej. «Necesito reabastecer arroz»)..." 
            autocomplete="off"
            aria-label="Mensaje para el agente de Barrio Market"
          />
        </div>
        <button type="submit" id="btn-send" class="btn-send" aria-label="Enviar mensaje" title="Enviar mensaje">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <!-- Scripts: Modular Components Architecture -->
  <script src="js/services/apiService.js"></script>
  <script src="js/components/ChatUtils.js"></script>
  <script src="js/components/OrderSummaryCard.js"></script>
  <script src="js/components/RegistrationForm.js"></script>
  <script src="js/components/ActionButtons.js"></script>
  <script src="js/components/TypingIndicator.js"></script>
  <script src="js/components/MessageBubble.js"></script>
  <script src="js/components/chatComponents.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
